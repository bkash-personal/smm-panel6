<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - SMM Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <h3 class="mb-4">📦 আমার অর্ডারসমূহ</h3>
    <div class="card p-3">
      <table class="table table-hover">
        <thead>
          <tr><th>ID</th><th>Service</th><th>Link</th><th>Quantity</th><th>Charge</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const user = requireLogin();
    if (user) {
      renderNavbar();
      const orders = getData(DB_KEYS.orders, []).filter((o) => o.userId === user.id).reverse();
      const body = document.getElementById('ordersBody');
      if (orders.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="text-center text-muted">কোনো অর্ডার নেই</td></tr>';
      } else {
        body.innerHTML = orders
          .map(
            (o) => `<tr>
              <td>#${o.id}</td>
              <td>${o.serviceName}</td>
              <td><a href="${o.link}" target="_blank" class="text-truncate d-inline-block" style="max-width:150px;">${o.link}</a></td>
              <td>${o.quantity}</td>
              <td>৳${o.charge.toFixed(2)}</td>
              <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
              <td class="small text-muted">${new Date(o.createdAt).toLocaleString()}</td>
            </tr>`
          )
          .join('');
      }
    }
  </script>
</body>
</html>
