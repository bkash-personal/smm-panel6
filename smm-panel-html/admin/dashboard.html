<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - SMM Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <h3 class="mb-4">🛠️ অ্যাডমিন ড্যাশবোর্ড</h3>
    <div class="row g-3">
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-people stat-icon"></i>
          <small class="text-muted">Total Users</small>
          <h2 id="totalUsers">0</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-box-seam stat-icon"></i>
          <small class="text-muted">Total Orders</small>
          <h2 id="totalOrders">0</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-hourglass-split stat-icon"></i>
          <small class="text-muted">Pending Orders</small>
          <h2 id="pendingOrders">0</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-cash-coin stat-icon"></i>
          <small class="text-muted">Pending Fund Requests</small>
          <h2 id="pendingFunds">0</h2>
        </div>
      </div>
    </div>

    <div class="card p-3 mt-4">
      <small class="text-muted">Total Revenue (from orders)</small>
      <h2 id="totalRevenue">৳0.00</h2>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    if (requireAdmin()) {
      renderNavbar('../');
      const users = getData(DB_KEYS.users, []);
      const orders = getData(DB_KEYS.orders, []);
      const funds = getData(DB_KEYS.funds, []);

      document.getElementById('totalUsers').textContent = users.filter((u) => u.role === 'user').length;
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('pendingOrders').textContent = orders.filter((o) => o.status === 'Pending').length;
      document.getElementById('pendingFunds').textContent = funds.filter((f) => f.status === 'Pending').length;
      document.getElementById('totalRevenue').textContent = '৳' + orders.reduce((sum, o) => sum + o.charge, 0).toFixed(2);
    }
  </script>
</body>
</html>
