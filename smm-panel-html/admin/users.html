<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users - SMM Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <h3 class="mb-4">👥 ইউজার ম্যানেজমেন্ট</h3>
    <div class="card p-3">
      <table class="table table-hover">
        <thead>
          <tr><th>ID</th><th>Username</th><th>Email</th><th>Balance</th><th>Add Balance</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    if (requireAdmin()) {
      renderNavbar('../');

      function renderUsers() {
        const users = getData(DB_KEYS.users, []).filter((u) => u.role === 'user');
        document.getElementById('usersBody').innerHTML = users
          .map(
            (u) => `<tr>
              <td>${u.id}</td>
              <td>${u.username}</td>
              <td>${u.email}</td>
              <td>৳${u.balance.toFixed(2)}</td>
              <td>
                <div class="d-flex gap-1">
                  <input type="number" step="0.01" class="form-control form-control-sm" id="amount-${u.id}" placeholder="Amount" />
                  <button class="btn btn-sm btn-success" onclick="addBalance(${u.id})">Add</button>
                </div>
              </td>
            </tr>`
          )
          .join('');
      }

      function addBalance(id) {
        const input = document.getElementById('amount-' + id);
        const amt = parseFloat(input.value);
        if (!amt) return;
        const users = getData(DB_KEYS.users, []);
        const user = users.find((u) => u.id === id);
        if (user) {
          user.balance += amt;
          setData(DB_KEYS.users, users);
          renderUsers();
        }
      }
      window.addBalance = addBalance;

      renderUsers();
    }
  </script>
</body>
</html>
