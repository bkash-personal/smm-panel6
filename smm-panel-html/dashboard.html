<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - SMM Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <h3 class="mb-4">ড্যাশবোর্ড</h3>

    <div class="row g-3 mb-4">
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-wallet2 stat-icon"></i>
          <small class="text-muted">Balance</small>
          <h2 id="statBalance">৳0.00</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-box-seam stat-icon"></i>
          <small class="text-muted">Total Orders</small>
          <h2 id="statOrders">0</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-cash-stack stat-icon"></i>
          <small class="text-muted">Total Spent</small>
          <h2 id="statSpent">৳0.00</h2>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="card stat-card p-3">
          <i class="bi bi-hourglass-split stat-icon"></i>
          <small class="text-muted">Pending Orders</small>
          <h2 id="statPending">0</h2>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-4">
      <a href="new-order.html" class="btn btn-primary"><i class="bi bi-cart-plus"></i> নতুন অর্ডার দিন</a>
      <a href="add-funds.html" class="btn btn-outline-success"><i class="bi bi-wallet2"></i> Add Funds</a>
    </div>

    <div class="card p-3">
      <h5>সাম্প্রতিক অর্ডার</h5>
      <table class="table table-hover mt-2">
        <thead>
          <tr><th>ID</th><th>Service</th><th>Quantity</th><th>Charge</th><th>Status</th></tr>
        </thead>
        <tbody id="recentOrdersBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const user = requireLogin();
    if (user) {
      renderNavbar();

      const orders = getData(DB_KEYS.orders, []).filter((o) => o.userId === user.id);
      const balance = user.balance;
      const totalSpent = orders.reduce((sum, o) => sum + o.charge, 0);
      const pending = orders.filter((o) => o.status === 'Pending').length;

      document.getElementById('statBalance').textContent = '৳' + balance.toFixed(2);
      document.getElementById('statOrders').textContent = orders.length;
      document.getElementById('statSpent').textContent = '৳' + totalSpent.toFixed(2);
      document.getElementById('statPending').textContent = pending;

      const recent = orders.slice(-5).reverse();
      const body = document.getElementById('recentOrdersBody');
      if (recent.length === 0) {
        body.innerHTML = '<tr><td colspan="5" class="text-center text-muted">কোনো অর্ডার নেই</td></tr>';
      } else {
        body.innerHTML = recent
          .map(
            (o) => `<tr>
              <td>#${o.id}</td>
              <td>${o.serviceName}</td>
              <td>${o.quantity}</td>
              <td>৳${o.charge.toFixed(2)}</td>
              <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
            </tr>`
          )
          .join('');
      }
    }
  </script>
</body>
</html>
