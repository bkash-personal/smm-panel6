<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - SMM Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="col-lg-6 d-none d-lg-flex auth-hero">
      <div>
        <h1 class="brand-title mb-3"><i class="bi bi-rocket-takeoff-fill"></i> SMM Panel</h1>
        <p class="fs-5 opacity-75">আজই ফ্রি অ্যাকাউন্ট খুলুন এবং সেরা দামে আপনার সোশ্যাল মিডিয়া গ্রোথ শুরু করুন।</p>
        <ul class="list-unstyled mt-4 fs-6">
          <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i> সহজ ওয়ালেট সিস্টেম</li>
          <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i> অর্ডার ট্র্যাকিং</li>
          <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i> নিরাপদ ও দ্রুত</li>
        </ul>
      </div>
    </div>
    <div class="col-lg-6 auth-form-side">
      <div class="auth-card p-4">
        <h3 class="mb-1">📝 রেজিস্ট্রেশন করুন</h3>
        <p class="text-muted mb-4">নতুন অ্যাকাউন্ট তৈরি করুন, মাত্র কয়েক সেকেন্ডে</p>
        <div id="errorBox" class="alert alert-danger py-2 d-none"></div>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-success w-100 py-2">Register করুন</button>
        </form>
        <p class="text-center mt-3 mb-0">
          আগে থেকে অ্যাকাউন্ট আছে? <a href="login.html" class="fw-semibold">লগইন করুন</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result = registerUser(username, email, password);
      const errorBox = document.getElementById('errorBox');
      if (!result.ok) {
        errorBox.textContent = result.error;
        errorBox.classList.remove('d-none');
        return;
      }
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
